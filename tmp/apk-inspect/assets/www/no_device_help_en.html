<body>

Currently,this app support four type of communication interface：
<br>
1.AP模式的Wi-Fi设备
<br>
2.STA模式的Wi-Fi设备
<br>
3.BLE 蓝牙设备
<br>
4.通过手机OTG接口连接的串口设备

<br>
如果你无法查找到设备，请先检查是否持有以上四种设备，并且确保电源接通。
</body>
